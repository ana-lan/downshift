[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "downshift"
dynamic = ["version"]
description = "Cut LLM costs per PR: find every LLM call, prove which can use cheaper models, and show the cost impact of every change."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anagha" }]
keywords = ["llm", "cost", "openai", "evals", "static-analysis", "ci", "github-action", "model-routing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "openai>=1.40",
    "pyyaml>=6.0",
    "tiktoken>=0.7",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "build>=1.2",
    "twine>=5.0",
    "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/ana-lan/downshift"
Demo = "https://downshift-llm.vercel.app/"
Documentation = "https://github.com/ana-lan/downshift/tree/main/docs"
Issues = "https://github.com/ana-lan/downshift/issues"
Changelog = "https://github.com/ana-lan/downshift/blob/main/CHANGELOG.md"

[project.scripts]
downshift = "downshift.cli:main"

[tool.hatch.version]
path = "src/downshift/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/downshift"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
markers = ["integration: hits a local Ollama server (run with: pytest -m integration)"]

[tool.coverage.run]
source = ["downshift"]
branch = true

[tool.coverage.report]
show_missing = true
