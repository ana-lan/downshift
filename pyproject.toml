[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "downshift"
dynamic = ["version"]
description = "Cut LLM costs per PR: find every LLM call, prove which can use cheaper models, and show the cost impact of every change."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anagha" }]
dependencies = [
    "openai>=1.40",
    "pyyaml>=6.0",
    "tiktoken>=0.7",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "build>=1.2",
    "types-PyYAML",
]

[project.scripts]
downshift = "downshift.cli:main"

[tool.hatch.version]
path = "src/downshift/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/downshift"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
markers = ["integration: hits a local Ollama server (run with: pytest -m integration)"]

[tool.coverage.run]
source = ["downshift"]
branch = true

[tool.coverage.report]
show_missing = true
