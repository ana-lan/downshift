# Downshift config for the SupportDesk demo app.
# Assumes 20,000 tickets/day, each running every LLM feature once.
version: 1

provider:
  base_url: "http://localhost:11434/v1"

models:
  baseline: "qwen2.5:7b"
  candidates: ["qwen2.5:3b", "qwen2.5:1.5b", "qwen2.5:0.5b"]

quality_threshold: 0.95
# A cheaper model must also pass at least this share of cases on its own.
min_pass_rate: 0.80

pricing:
  "qwen2.5:7b":   { input: 2.50, output: 10.00, tier: premium }
  "qwen2.5:3b":   { input: 0.40, output: 1.60,  tier: standard }
  "qwen2.5:1.5b": { input: 0.15, output: 0.60,  tier: budget }
  "qwen2.5:0.5b": { input: 0.10, output: 0.40,  tier: nano }

volume:
  default_per_day: 20000
  # Every feature runs once per ticket, so all sites use the default.
  # Override one with per_call_site, e.g.:
  # per_call_site: {"supportdesk/triage.py::classify_category": 5000}
