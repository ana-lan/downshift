name: Cost diff

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  cost-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Downshift cost diff (SupportDesk)
        uses: ./
        with:
          path: examples/supportdesk
          package: .
          fail-above: "500"
